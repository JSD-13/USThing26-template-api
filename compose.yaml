# The whole service: the API on http://localhost:3000 and its MongoDB.
#
# Start both:
#
#   docker compose up -d --build
#
# Or only the database, for `bun run dev` with MONGO_URI from .env.example:
#
#   docker compose up -d mongodb
#
# Stop:
#
#   docker compose stop
#
# Reset the data volume:
#
#   docker compose down -v

services:
  api:
    build: .
    container_name: timetable-api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/timetable-api
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8.3.4
    container_name: timetable-api-mongo
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
